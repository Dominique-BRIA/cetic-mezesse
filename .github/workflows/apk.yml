name: APK Android

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # L'adresse de l'API se règle dans Settings > Secrets and variables > Actions > Variables (API_URL)
      - run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://cetic-mezesse-api.azurewebsites.net/api' }}
      - uses: actions/upload-artifact@v4
        with:
          name: cetic-mezesse-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
