name: APK Android

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Clé de publication tirée des secrets du dépôt (Settings > Secrets and variables > Actions > Secrets).
      - name: Clé de signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # L'alias n'est pas sensible : accepté en secret ou en variable.
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets de signature manquants : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # L'adresse de l'API se règle dans Settings > Secrets and variables > Actions > Variables (API_URL)
      - run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://cetic-mezesse-api-dgfxfucegjg8gscb.francecentral-01.azurewebsites.net/api' }}
      # Refuse un APK signé avec la clé de débogage.
      - name: Vérification de la signature
        run: |
          certificat=$(keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk)
          echo "$certificat" | grep -E "Owner|Propriétaire|SHA256" || true
          if echo "$certificat" | grep -q "CN=Android Debug"; then
            echo "::error::L'APK est signé avec la clé de débogage."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cetic-mezesse-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
