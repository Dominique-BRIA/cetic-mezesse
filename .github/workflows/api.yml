name: API Azure

# Redéploie l'API sur Azure App Service à chaque push qui touche api/.
# L'API est compilée ici puis envoyée prête à lancer : Azure ne compile plus
# (SCM_DO_BUILD_DURING_DEPLOYMENT=false), son « npm install » prenait plus de 40 minutes.
# La commande de démarrage d'Azure est « npm run demarrage » : migrations, puis serveur.
on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

concurrency:
  group: api-azure
  cancel-in-progress: false

jobs:
  verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # JWT_SECRET factice : le typage et les tests de calcul n'ouvrent pas de session.
      - run: npx prisma generate && npm run typecheck && npm test
        env:
          JWT_SECRET: verification

  deploiement:
    needs: verification
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_URL }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      # Même système qu'Azure (Linux, OpenSSL 3) : le moteur Prisma compilé ici y fonctionne.
      - run: npm ci
      - run: npm run build
      - run: npm prune --omit=dev
      - name: Archive prête à lancer
        run: zip -qr ../api.zip package.json dist node_modules prisma && ls -lh ../api.zip
      - uses: azure/webapps-deploy@v3
        with:
          app-name: cetic-mezesse-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api.zip
      - name: Vérification de l'API en ligne
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -m 60 "$API_URL/sante" | grep -q '"ok"'; then echo "API en ligne"; exit 0; fi
            sleep 20
          done
          echo "::error::L'API ne répond pas sur $API_URL/sante"
          exit 1
