name: API Azure

# Redéploie l'API sur Azure App Service à chaque push qui touche api/.
# Azure installe les dépendances et compile (SCM_DO_BUILD_DURING_DEPLOYMENT=true) ;
# la commande de démarrage applique les migrations avant de lancer le serveur.
on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

concurrency:
  group: api-azure
  cancel-in-progress: false

jobs:
  verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # JWT_SECRET factice : le typage et les tests de calcul n'ouvrent pas de session.
      - run: npx prisma generate && npm run typecheck && npm test
        env:
          JWT_SECRET: verification

  deploiement:
    needs: verification
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      # Seulement les sources : Azure fait npm install et npm run build.
      - name: Archive de l'API
        working-directory: api
        run: zip -qr ../api.zip package.json package-lock.json tsconfig.json src prisma
      - uses: azure/webapps-deploy@v3
        with:
          app-name: cetic-mezesse-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api.zip
      - name: Vérification de l'API en ligne
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/sante" | grep -q '"ok"'; then echo "API en ligne"; exit 0; fi
            sleep 20
          done
          echo "::error::L'API ne répond pas sur $API_URL/sante"
          exit 1
